<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter + Docs</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #111;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

/* PÁGINAS */
.page {
    display: none;
    height: 100vh;
    flex-direction: column;
}

.page.active {
    display: flex;
}

/* ================= PÁGINA 1 ================= */

#controls {
    background: #222;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
}

textarea {
    width: 300px;
    height: 40px;
    background: #333;
    color: #fff;
    border: 1px solid #444;
    padding: 8px;
    border-radius: 5px;
    resize: none;
}

button {
    padding: 8px 14px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

#btnPlay { background: #28a745; color: #fff; }
#btnReset { background: #007bff; color: #fff; }
#btnPage2 { background: #ffc107; color: #000; }

#teleprompter-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    max-width: 900px;
    margin: auto;
}

#reading-guide {
    position: absolute;
    top: 50%;
    width: 100%;
    height: 80px;
    transform: translateY(-50%);
    border-top: 2px dashed rgba(255,255,0,0.4);
    border-bottom: 2px dashed rgba(255,255,0,0.4);
    pointer-events: none;
}

#prompter-text {
    position: absolute;
    top: 100%;
    width: 100%;
    padding: 0 40px;
    text-align: center;
    font-size: 50px;
    font-weight: bold;
    white-space: pre-wrap;
}

/* ================= PÁGINA 2 ================= */

#page2 {
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.docs-box {
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    background: #1b1b1b;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.docs-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.docs-textarea {
    flex: 1;
    width: 100%;
    background: #0f0f0f;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    font-size: 26px;
    line-height: 1.5;
    resize: none;
    outline: none;
}

#btnBack {
    background: #dc3545;
    color: #fff;
}
</style>
</head>

<body>

<!-- ================= PÁGINA 1 ================= -->
<div id="page1" class="page active">

<div id="controls">
    <textarea id="txtInput" placeholder="Cole seu roteiro..."></textarea>

    <button id="btnPlay">INICIAR</button>
    <button id="btnReset">REINICIAR</button>
    <button id="btnPage2">PÁGINA 2</button>
</div>

<div id="teleprompter-container">
    <div id="reading-guide"></div>
    <div id="prompter-text">Cole seu texto aqui...</div>
</div>

</div>

<!-- ================= PÁGINA 2 ================= -->
<div id="page2" class="page">

<div class="docs-box">

    <div class="docs-controls">
        <button id="btnBack">⬅ Voltar</button>
        <span>Modo Leitura</span>
    </div>

    <textarea class="docs-textarea" id="docsText"
        placeholder="Cole seu roteiro aqui e leia sem distrações..."></textarea>

</div>

</div>

<script>

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

const txtInput = document.getElementById("txtInput");
const docsText = document.getElementById("docsText");
const prompterText = document.getElementById("prompter-text");

const btnPlay = document.getElementById("btnPlay");
const btnReset = document.getElementById("btnReset");
const btnPage2 = document.getElementById("btnPage2");
const btnBack = document.getElementById("btnBack");

let isPlaying = false;
let y = 0;
let speed = 1.5;
let anim;

// ================= TROCA DE PÁGINA =================
btnPage2.onclick = () => {
    page1.classList.remove("active");
    page2.classList.add("active");
    docsText.value = txtInput.value;
};

btnBack.onclick = () => {
    page2.classList.remove("active");
    page1.classList.add("active");
};

// ================= TEXTO =================
txtInput.addEventListener("input", () => {
    prompterText.textContent = txtInput.value;
    docsText.value = txtInput.value;
});

// ================= TELEPROMPTER =================
function loop() {
    if (!isPlaying) return;

    y -= speed;
    prompterText.style.transform = `translateY(${y}px)`;

    anim = requestAnimationFrame(loop);
}

btnPlay.onclick = () => {
    isPlaying = !isPlaying;

    if (isPlaying) {
        btnPlay.textContent = "PAUSAR";
        loop();
    } else {
        btnPlay.textContent = "INICIAR";
        cancelAnimationFrame(anim);
    }
};

btnReset.onclick = () => {
    y = 0;
    prompterText.style.transform = `translateY(0px)`;
};

</script>

</body>
</html>
